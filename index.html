<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>WANS HT</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:#070909;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    width:min(430px,100%);
    min-height:100vh;
    margin:auto;
    padding:14px;

    background:
    radial-gradient(
        circle at top,
        #263238,
        #0a0d0f 55%
    );
}

.header{
    text-align:center;
    padding:13px;

    border:2px solid #37474f;
    border-radius:15px;

    background:#101518;
}

.logo{
    color:#00e5ff;
    font-size:25px;
    font-weight:bold;
    letter-spacing:4px;
}

.sub{
    margin-top:4px;
    font-size:11px;
    color:#90a4ae;
}

.screen{
    margin-top:14px;
    padding:14px;

    border:3px solid #263238;
    border-radius:15px;

    background:#030605;

    box-shadow:
    inset 0 0 25px #000;
}

.display{
    border:2px solid #37474f;
    border-radius:9px;

    padding:12px;

    background:#071008;
}

.top{
    display:flex;
    justify-content:space-between;

    color:#69f0ae;

    font-family:monospace;
    font-size:12px;
}

.freq{
    text-align:center;

    font-family:monospace;

    font-size:38px;
    font-weight:bold;

    color:#76ff03;

    margin:6px 0;

    text-shadow:
    0 0 8px #1b5e20;
}

.rx{
    text-align:center;

    color:#69f0ae;

    min-height:20px;

    font-family:monospace;
    font-weight:bold;
}

.signal{
    display:flex;
    gap:3px;

    height:8px;

    margin-top:8px;
}

.signal span{
    flex:1;

    background:#263238;

    border-radius:2px;
}

.signal span.on{
    background:#76ff03;
}

.pttWrap{
    text-align:center;
    margin-top:18px;
}

.ptt{
    width:215px;
    height:215px;

    border-radius:50%;

    border:10px solid #263238;

    background:
    radial-gradient(
        circle at 40% 30%,
        #ef5350,
        #c62828 55%,
        #700000
    );

    color:white;

    font-size:31px;
    font-weight:bold;

    box-shadow:
    0 12px 25px #000,
    inset 0 5px 12px #ff8a80;

    touch-action:none;
    user-select:none;
}

.ptt.tx{
    background:
    radial-gradient(
        circle,
        #ff5252,
        #d50000 60%,
        #700000
    );

    box-shadow:
    0 0 30px red,
    inset 0 0 30px #ff8a80;
}

.ptt:disabled{
    opacity:.35;
}

.hint{
    margin-top:8px;

    color:#90a4ae;

    font-size:12px;
}

.panel{
    margin-top:14px;

    padding:12px;

    border-radius:12px;

    border:1px solid #263238;

    background:#0c1114;
}

.title{
    color:#00e5ff;

    font-size:12px;
    font-weight:bold;

    margin-bottom:9px;
}

input{
    width:100%;

    padding:12px;

    margin-bottom:8px;

    border-radius:9px;

    border:1px solid #455a64;

    background:#050707;

    color:white;

    font-size:16px;
}

button.normal{
    width:100%;

    padding:13px;

    border:0;

    border-radius:9px;

    background:#263238;

    color:white;

    font-weight:bold;

    margin-top:6px;
}

button.normal:active{
    background:#455a64;
}

button.normal.active{
    background:#00a152;
}

.channels{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:6px;
}

.channel{
    padding:10px 4px;

    border:1px solid #455a64;

    border-radius:8px;

    background:#11181c;

    color:#cfd8dc;

    font-size:11px;

    font-weight:bold;
}

.channel.active{
    background:#1b5e20;

    border-color:#76ff03;

    color:#76ff03;
}

.status{
    text-align:center;

    margin-top:12px;

    color:#90a4ae;

    font-size:12px;
}

.connected{
    color:#00e676 !important;
}

.txStatus{
    margin-top:7px;

    text-align:center;

    min-height:18px;

    color:#ff5252;

    font-family:monospace;

    font-weight:bold;
}

.users{
    margin-top:10px;

    color:#90a4ae;

    font-size:12px;

    text-align:center;
}

.micOk{
    background:#00695c !important;
}

</style>
</head>

<body>

<div class="app">

<div class="header">

    <div class="logo">
        WANS HT
    </div>

    <div class="sub">
        VIRTUAL HANDY TALKY
    </div>

</div>


<div class="screen">

    <div class="display">

        <div class="top">

            <span id="channelText">
                CH-01
            </span>

            <span id="battery">
                ONLINE
            </span>

        </div>


        <div class="freq" id="frequency">
            433.500
        </div>


        <div class="rx" id="rxText">
            STANDBY
        </div>


        <div class="signal" id="signal">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>


    <div class="pttWrap">

        <button
            id="ptt"
            class="ptt"
            disabled>

            PTT

        </button>

        <div class="txStatus" id="txStatus">
            MICROPHONE BELUM AKTIF
        </div>

        <div class="hint">
            Klik = ON/OFF • Tekan lama = TX max 5 detik
        </div>

    </div>

</div>


<div class="panel">

    <div class="title">
        IDENTITAS
    </div>

    <input
        id="name"
        maxlength="20"
        placeholder="Nama / Callsign">

</div>


<div class="panel">

    <div class="title">
        CHANNEL
    </div>

    <div class="channels" id="channels"></div>

</div>


<div class="panel">

    <div class="title">
        MICROPHONE
    </div>

    <button
        id="micButton"
        class="normal">

        🎙️ IZINKAN MICROPHONE

    </button>

</div>


<div class="status" id="status">
    Memuat sistem...
</div>


<div class="users" id="users">
    0 USER DI CHANNEL
</div>

</div>


<script type="module">

import {
    joinRoom
} from "https://esm.run/trystero";


/* =========================================================
   KONFIGURASI
========================================================= */

const APP_ID =
    "WANS_HT_VOICE_2026_FIX";


const frequencies = [

    "433.500",
    "433.525",
    "433.550",
    "433.575",

    "433.600",
    "433.625",
    "433.650",
    "433.675",

    "433.700",
    "433.725",
    "433.750",
    "433.775",

    "433.800",
    "433.825",
    "433.850",
    "433.875"

];


/* =========================================================
   ELEMENT
========================================================= */

const channelText =
    document.getElementById("channelText");

const frequency =
    document.getElementById("frequency");

const rxText =
    document.getElementById("rxText");

const signal =
    document.getElementById("signal");

const ptt =
    document.getElementById("ptt");

const txStatus =
    document.getElementById("txStatus");

const status =
    document.getElementById("status");

const users =
    document.getElementById("users");

const nameInput =
    document.getElementById("name");

const micButton =
    document.getElementById("micButton");

const channels =
    document.getElementById("channels");


/* =========================================================
   STATE
========================================================= */

let channelIndex = 0;

let room = null;

let localStream = null;

let microphoneReady = false;

let transmitting = false;

let clickTimer = null;

let longPress = false;

let txTimeout = null;

let peerAudios = {};

let peerNames = {};

let peerCount = 0;


/* =========================================================
   CHANNEL BUTTON
========================================================= */

frequencies.forEach(
    (freq,index)=>{

        const btn =
            document.createElement("button");

        btn.className =
            "channel";

        btn.textContent =
            "CH-" +
            String(index + 1)
            .padStart(2,"0");

        btn.onclick =
            ()=>{
                selectChannel(index);
            };

        channels.appendChild(btn);

    }
);


/* =========================================================
   UPDATE DISPLAY
========================================================= */

function updateDisplay(){

    channelText.textContent =
        "CH-" +
        String(channelIndex + 1)
        .padStart(2,"0");

    frequency.textContent =
        frequencies[channelIndex];

    document
    .querySelectorAll(".channel")
    .forEach(
        (btn,index)=>{

            btn.classList.toggle(
                "active",
                index === channelIndex
            );

        }
    );

}


/* =========================================================
   SELECT CHANNEL
========================================================= */

async function selectChannel(index){

    channelIndex = index;

    updateDisplay();

    await leaveRoom();

    await joinChannel();

}


/* =========================================================
   ROOM ID
========================================================= */

function getRoomId(){

    /*
       Nama room dibuat dari channel.

       Semua HP yang memilih CH yang sama
       masuk room yang sama.
    */

    return (
        "WANS-HT-" +
        String(channelIndex + 1)
        .padStart(2,"0")
    );

}


/* =========================================================
   JOIN CHANNEL
========================================================= */

async function joinChannel(){

    try{

        status.textContent =
            "Menghubungkan CH-" +
            String(channelIndex + 1)
            .padStart(2,"0") +
            "...";

        room =
            joinRoom(
                {
                    appId: APP_ID
                },
                getRoomId()
            );


        /*
           PEER MASUK
        */

        room.onPeerJoin =
            peerId => {

                peerCount++;

                updateUserCount();

                status.textContent =
                    "PEER TERHUBUNG";

                /*
                   Kalau mic sudah aktif,
                   kirim stream ke peer baru.
                */

                if(
                    localStream &&
                    microphoneReady
                ){

                    try{

                        room.addStream(
                            localStream,
                            {
                                target: peerId
                            }
                        );

                    }catch(e){

                        console.error(
                            "addStream peer baru:",
                            e
                        );

                    }

                }

            };


        /*
           PEER KELUAR
        */

        room.onPeerLeave =
            peerId => {

                peerCount =
                    Math.max(
                        0,
                        peerCount - 1
                    );

                updateUserCount();

                if(
                    peerAudios[peerId]
                ){

                    try{

                        peerAudios[
                            peerId
                        ].pause();

                    }catch(e){}

                    delete
                        peerAudios[
                            peerId
                        ];

                }

                delete
                    peerNames[
                        peerId
                    ];

            };


        /*
           AUDIO DARI HP LAIN
        */

        room.onPeerStream =
            (stream,peerId)=>{

                console.log(
                    "AUDIO MASUK DARI:",
                    peerId
                );

                let audio =
                    peerAudios[
                        peerId
                    ];


                if(!audio){

                    audio =
                        new Audio();

                    audio.autoplay =
                        true;

                    audio.playsInline =
                        true;

                    audio.volume =
                        1.0;

                    peerAudios[
                        peerId
                    ] =
                        audio;

                }


                audio.srcObject =
                    stream;


                audio.play()
                .catch(
                    error=>{

                        console.log(
                            "Autoplay menunggu interaksi:",
                            error
                        );

                    }
                );


                rxText.textContent =
                    "RX: " +
                    (
                        peerNames[
                            peerId
                        ] ||
                        "PEER"
                    );


                setSignal(true);

                setTimeout(
                    ()=>{
                        if(
                            !transmitting
                        ){

                            rxText.textContent =
                                "STANDBY";

                            setSignal(false);

                        }

                    },
                    1200
                );

            };


        status.textContent =
            "CH-" +
            String(channelIndex + 1)
            .padStart(2,"0") +
            " SIAP";

        status.classList.add(
            "connected"
        );


        updateUserCount();


        /*
           Kalau mic sudah aktif sebelumnya,
           langsung kirim stream ke peer yang
           sudah ada.
        */

        if(
            localStream &&
            microphoneReady
        ){

            room.addStream(
                localStream
            );

        }

    }catch(error){

        console.error(
            "JOIN ERROR:",
            error
        );

        status.textContent =
            "GAGAL TERHUBUNG";

        status.classList.remove(
            "connected"
        );

    }

}


/* =========================================================
   USER COUNT
========================================================= */

function updateUserCount(){

    let count = 0;

    if(room){

        try{

            count =
                Object.keys(
                    room.getPeers()
                ).length;

        }catch(e){

            count =
                peerCount;

        }

    }

    users.textContent =
        count +
        " USER LAIN DI CHANNEL";

}


/* =========================================================
   MICROPHONE
========================================================= */

micButton.onclick =
    async ()=>{

        if(microphoneReady){

            disableMicrophone();

            return;

        }


        try{

            status.textContent =
                "Meminta izin microphone...";


            localStream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    audio:{
                        echoCancellation:true,
                        noiseSuppression:true,
                        autoGainControl:true
                    },

                    video:false

                });


            /*
               Pastikan awalnya OFF.

               Track tetap hidup supaya koneksi WebRTC
               tidak perlu dibuat ulang setiap PTT.
            */

            localStream
            .getAudioTracks()
            .forEach(
                track=>{
                    track.enabled =
                        false;
                }
            );


            microphoneReady =
                true;


            ptt.disabled =
                false;


            micButton.textContent =
                "🎙️ MICROPHONE AKTIF";


            micButton.classList.add(
                "micOk"
            );


            txStatus.textContent =
                "MIC SIAP — PTT AKTIF";


            status.textContent =
                "MICROPHONE SIAP";


            /*
               Kirim stream ke semua peer
               yang sudah ada.
            */

            if(room){

                room.addStream(
                    localStream
                );

            }

        }catch(error){

            console.error(
                error
            );

            microphoneReady =
                false;

            ptt.disabled =
                true;

            status.textContent =
                "IZIN MICROPHONE DITOLAK / GAGAL";

            txStatus.textContent =
                "MICROPHONE TIDAK AKTIF";

        }

    };


/* =========================================================
   DISABLE MICROPHONE
========================================================= */

function disableMicrophone(){

    stopTransmit();


    if(
        room &&
        localStream
    ){

        try{

            room.removeStream(
                localStream
            );

        }catch(e){}

    }


    if(localStream){

        localStream
        .getTracks()
        .forEach(
            track=>{
                track.stop();
            }
        );

    }


    localStream =
        null;


    microphoneReady =
        false;


    ptt.disabled =
        true;


    micButton.textContent =
        "🎙️ IZINKAN MICROPHONE";


    micButton.classList.remove(
        "micOk"
    );


    txStatus.textContent =
        "MICROPHONE BELUM AKTIF";


    status.textContent =
        "MICROPHONE OFF";

}


/* =========================================================
   START TRANSMIT
========================================================= */

function startTransmit(){

    if(
        !microphoneReady ||
        !localStream ||
        !room
    ){

        return;

    }


    if(transmitting){

        return;

    }


    transmitting =
        true;


    localStream
    .getAudioTracks()
    .forEach(
        track=>{
            track.enabled =
                true;
        }
    );


    ptt.classList.add(
        "tx"
    );


    ptt.textContent =
        "TX";


    txStatus.textContent =
        "TRANSMITTING";


    rxText.textContent =
        "TX: " +
        (
            nameInput.value.trim()
            ||
            "ANDA"
        );


    setSignal(true);


    /*
       Pastikan stream benar-benar dikirim
       ke semua peer.
    */

    try{

        room.addStream(
            localStream
        );

    }catch(error){

        console.error(
            "TX addStream:",
            error
        );

    }

}


/* =========================================================
   STOP TRANSMIT
========================================================= */

function stopTransmit(){

    if(!localStream){

        transmitting =
            false;

        return;

    }


    localStream
    .getAudioTracks()
    .forEach(
        track=>{
            track.enabled =
                false;
        }
    );


    transmitting =
        false;


    ptt.classList.remove(
        "tx"
    );


    ptt.textContent =
        "PTT";


    txStatus.textContent =
        microphoneReady
        ? "MIC SIAP — PTT AKTIF"
        : "MICROPHONE BELUM AKTIF";


    rxText.textContent =
        "STANDBY";


    setSignal(false);


    if(txTimeout){

        clearTimeout(
            txTimeout
        );

        txTimeout =
            null;

    }

}


/* =========================================================
   QUICK CLICK
========================================================= */

function quickToggle(){

    if(!microphoneReady){

        return;

    }


    if(transmitting){

        stopTransmit();

    }else{

        startTransmit();

    }

}


/* =========================================================
   PTT POINTER DOWN
========================================================= */

ptt.addEventListener(
    "pointerdown",
    event=>{

        if(ptt.disabled){

            return;

        }


        event.preventDefault();


        longPress =
            false;


        clickTimer =
            setTimeout(
                ()=>{

                    longPress =
                        true;

                    startTransmit();


                    /*
                       LONG PRESS MAKSIMAL 5 DETIK
                    */

                    txTimeout =
                        setTimeout(
                            ()=>{

                                stopTransmit();

                            },
                            5000
                        );

                },
                400
            );

    }
);


/* =========================================================
   PTT POINTER UP
========================================================= */

function pttRelease(event){

    if(ptt.disabled){

        return;

    }


    event.preventDefault();


    if(clickTimer){

        clearTimeout(
            clickTimer
        );

        clickTimer =
            null;

    }


    /*
       Kalau long press:
       release = langsung OFF
    */

    if(longPress){

        stopTransmit();

        longPress =
            false;

        return;

    }


    /*
       Kalau klik cepat:
       toggle ON/OFF
    */

    quickToggle();

}


ptt.addEventListener(
    "pointerup",
    pttRelease
);

ptt.addEventListener(
    "pointercancel",
    pttRelease
);

ptt.addEventListener(
    "pointerleave",
    event=>{

        /*
           Jangan dianggap release
           kalau pointer masih ditekan.

           Browser mobile kadang mengirim
           pointerleave saat jari bergeser.
        */

    }
);


/* =========================================================
   SIGNAL
========================================================= */

function setSignal(on){

    signal
    .querySelectorAll("span")
    .forEach(
        (bar,index)=>{

            if(on){

                /*
                   TX/RX meter
                */

                const level =
                    2 +
                    Math.floor(
                        Math.random() * 7
                    );

                bar.classList.toggle(
                    "on",
                    index < level
                );

            }else{

                bar.classList.remove(
                    "on"
                );

            }

        }
    );

}


/* =========================================================
   LEAVE ROOM
========================================================= */

async function leaveRoom(){

    stopTransmit();


    if(room){

        try{

            room.leave();

        }catch(e){

            console.error(e);

        }

        room =
            null;

    }


    Object
    .values(
        peerAudios
    )
    .forEach(
        audio=>{

            try{

                audio.pause();

                audio.srcObject =
                    null;

            }catch(e){}

        }
    );


    peerAudios =
        {};

    peerCount =
        0;


    updateUserCount();

}


/* =========================================================
   NAME
========================================================= */

nameInput.value =
    localStorage.getItem(
        "wans_ht_name"
    ) ||
    "";


nameInput.addEventListener(
    "input",
    ()=>{

        localStorage.setItem(
            "wans_ht_name",
            nameInput.value
        );

    }
);


/* =========================================================
   START
========================================================= */

updateDisplay();

joinChannel();


/* =========================================================
   PAGE CLOSE
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{
        try{

            if(room){

                room.leave();

            }

        }catch(e){}
    }
);

</script>

</body>
</html>
