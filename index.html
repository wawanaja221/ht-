<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>WANS HT VIRTUAL</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:#080a0c;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.ht{
    width:360px;
    max-width:94vw;
    background:#15191d;
    border:2px solid #30363b;
    border-radius:25px;
    padding:18px;
    box-shadow:0 15px 40px #000;
}

.brand{
    text-align:center;
    font-weight:bold;
    font-size:20px;
    letter-spacing:2px;
    color:#ff8c00;
    margin-bottom:12px;
}

.screen{
    background:#06100a;
    border:3px solid #333;
    border-radius:12px;
    padding:15px;
    box-shadow:inset 0 0 15px #000;
}

.channel{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#35ff69;
}

.freq{
    text-align:center;
    font-family:monospace;
    font-size:20px;
    color:#b8ffbf;
    margin-top:5px;
}

.status{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
    color:#888;
}

.status.on{
    color:#ff3030;
}

.count{
    text-align:center;
    height:22px;
    margin-top:5px;
    color:#ffb000;
    font-weight:bold;
}

.channels{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:16px;
}

.ch{
    border:1px solid #444;
    border-radius:10px;
    background:#242a2f;
    color:#fff;
    padding:12px 5px;
    font-weight:bold;
    cursor:pointer;
}

.ch.active{
    background:#ff7b00;
    border-color:#ff9d3b;
    color:#000;
}

.ptt{
    width:100%;
    height:100px;
    margin-top:18px;
    border:0;
    border-radius:18px;
    background:#9b1717;
    color:#fff;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 7px 0 #4e0808;
    user-select:none;
    touch-action:none;
}

.ptt.on{
    background:#e51e1e;
    box-shadow:0 3px 0 #4e0808;
    transform:translateY(4px);
}

.info{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-top:15px;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="ht">

    <div class="brand">WANS HT</div>

    <div class="screen">

        <div class="channel" id="channel">
            CH1
        </div>

        <div class="freq" id="freq">
            433.500 MHz
        </div>

        <div class="status" id="status">
            PTT OFF
        </div>

        <div class="count" id="count"></div>

    </div>

    <div class="channels">

        <button class="ch active" data-ch="1">
            CH1
        </button>

        <button class="ch" data-ch="2">
            CH2
        </button>

        <button class="ch" data-ch="3">
            CH3
        </button>

        <button class="ch" data-ch="4">
            CH4
        </button>

        <button class="ch" data-ch="5">
            CH5
        </button>

        <button class="ch" data-ch="6">
            CH6
        </button>

    </div>

    <button class="ptt" id="ptt">
        PTT
    </button>

    <div class="info">
        Klik cepat = ON/OFF<br>
        Tekan/tahan = otomatis OFF setelah 5 detik
    </div>

</div>

<script>

const channels = {
    1:"433.500 MHz",
    2:"433.525 MHz",
    3:"433.550 MHz",
    4:"433.575 MHz",
    5:"433.600 MHz",
    6:"433.625 MHz"
};

let currentChannel = 1;

let pttOn = false;

let pressTimer = null;
let autoOffTimer = null;
let countdownTimer = null;

let holdMode = false;
let pointerDown = false;

const channelText = document.getElementById("channel");
const freqText = document.getElementById("freq");
const statusText = document.getElementById("status");
const countText = document.getElementById("count");
const pttButton = document.getElementById("ptt");


/* =========================
   CHANNEL
========================= */

document.querySelectorAll(".ch").forEach(button => {

    button.addEventListener("click", () => {

        currentChannel = Number(button.dataset.ch);

        channelText.textContent =
            "CH" + currentChannel;

        freqText.textContent =
            channels[currentChannel];

        document.querySelectorAll(".ch")
        .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        /*
         * Kalau nanti koneksi audio/WebRTC
         * ditambahkan, bagian pindah room/channel
         * dilakukan di sini.
         */

    });

});


/* =========================
   PTT ON
========================= */

function pttStart(){

    if(pttOn) return;

    pttOn = true;

    pttButton.classList.add("on");

    statusText.textContent = "PTT ON";
    statusText.classList.add("on");

}


/* =========================
   PTT OFF
========================= */

function pttStop(){

    pttOn = false;

    pttButton.classList.remove("on");

    statusText.textContent = "PTT OFF";
    statusText.classList.remove("on");

}


/* =========================
   MODE TEKAN/TAHAN
   OTOMATIS 5 DETIK
========================= */

function startFiveSecondMode(){

    holdMode = true;

    let seconds = 5;

    countText.textContent =
        "AUTO OFF " + seconds;

    countdownTimer = setInterval(() => {

        seconds--;

        if(seconds <= 0){

            clearInterval(countdownTimer);
            countdownTimer = null;

            countText.textContent = "";

            if(pttOn){
                pttStop();
            }

            holdMode = false;

            return;
        }

        countText.textContent =
            "AUTO OFF " + seconds;

    },1000);


    autoOffTimer = setTimeout(() => {

        if(pttOn){
            pttStop();
        }

        holdMode = false;

        countText.textContent = "";

    },5000);

}


/* =========================
   CANCEL TIMER
========================= */

function cancelTimers(){

    if(pressTimer){
        clearTimeout(pressTimer);
        pressTimer = null;
    }

    if(autoOffTimer){
        clearTimeout(autoOffTimer);
        autoOffTimer = null;
    }

    if(countdownTimer){
        clearInterval(countdownTimer);
        countdownTimer = null;
    }

    countText.textContent = "";

}


/* =========================
   POINTER DOWN
========================= */

function pointerDownHandler(e){

    e.preventDefault();

    if(pointerDown) return;

    pointerDown = true;

    holdMode = false;

    /*
     * Tunggu 350ms untuk menentukan
     * apakah tombol ditahan.
     */

    pressTimer = setTimeout(() => {

        if(pointerDown){

            /*
             * Tombol dianggap ditekan/tahan.
             */

            if(!pttOn){
                pttStart();
            }

            startFiveSecondMode();

        }

    },350);

}


/* =========================
   POINTER UP
========================= */

function pointerUpHandler(e){

    e.preventDefault();

    if(!pointerDown) return;

    pointerDown = false;

    /*
     * Kalau timer belum lewat,
     * berarti klik biasa.
     */

    if(pressTimer){

        clearTimeout(pressTimer);
        pressTimer = null;

        if(!holdMode){

            /*
             * KLIK BIASA:
             * OFF -> ON
             * ON  -> OFF
             */

            if(pttOn){
                pttStop();
            }else{
                pttStart();
            }

        }

        return;
    }

    /*
     * Kalau sudah masuk mode tahan,
     * lepas sebelum 5 detik = OFF.
     */

    if(holdMode){

        holdMode = false;

        if(autoOffTimer){
            clearTimeout(autoOffTimer);
            autoOffTimer = null;
        }

        if(countdownTimer){
            clearInterval(countdownTimer);
            countdownTimer = null;
        }

        countText.textContent = "";

        pttStop();

    }

}


/* =========================
   EVENT PTT
========================= */

pttButton.addEventListener(
    "pointerdown",
    pointerDownHandler
);

pttButton.addEventListener(
    "pointerup",
    pointerUpHandler
);

pttButton.addEventListener(
    "pointercancel",
    pointerUpHandler
);

pttButton.addEventListener(
    "pointerleave",
    e => {

        /*
         * Jangan otomatis OFF hanya
         * karena pointer keluar tombol.
         * Tetap tunggu pointerup.
         */

    }
);


/* =========================
   CEGAH MENU SENTUH
========================= */

pttButton.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);

</script>

</body>
</html>
