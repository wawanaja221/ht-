<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>WANS HT</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:#070909;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    width:min(430px,100%);
    min-height:100vh;
    margin:auto;
    padding:14px;
    background:
    radial-gradient(circle at top,#263238,#0a0d0f 55%);
}

.header{
    text-align:center;
    padding:13px;
    border:2px solid #37474f;
    border-radius:15px;
    background:#101518;
}

.logo{
    color:#00e5ff;
    font-size:25px;
    font-weight:bold;
    letter-spacing:4px;
}

.sub{
    margin-top:4px;
    font-size:11px;
    color:#90a4ae;
}

.screen{
    margin-top:14px;
    padding:14px;
    border:3px solid #263238;
    border-radius:15px;
    background:#030605;
    box-shadow:inset 0 0 25px #000;
}

.display{
    border:2px solid #37474f;
    border-radius:9px;
    padding:12px;
    background:#071008;
}

.top{
    display:flex;
    justify-content:space-between;
    color:#69f0ae;
    font-family:monospace;
    font-size:12px;
}

.freq{
    text-align:center;
    font-family:monospace;
    font-size:38px;
    font-weight:bold;
    color:#76ff03;
    margin:6px 0;
    text-shadow:0 0 8px #1b5e20;
}

.rx{
    text-align:center;
    color:#69f0ae;
    min-height:20px;
    font-family:monospace;
    font-weight:bold;
}

.signal{
    display:flex;
    gap:3px;
    height:8px;
    margin-top:8px;
}

.signal span{
    flex:1;
    background:#263238;
    border-radius:2px;
}

.signal span.on{
    background:#76ff03;
}

.pttWrap{
    text-align:center;
    margin-top:18px;
}

.ptt{
    width:215px;
    height:215px;
    border-radius:50%;
    border:10px solid #263238;
    background:
    radial-gradient(circle at 40% 30%,
    #ef5350,#c62828 55%,#700000);
    color:white;
    font-size:31px;
    font-weight:bold;
    box-shadow:
    0 12px 25px #000,
    inset 0 5px 12px #ff8a80;
    touch-action:none;
    user-select:none;
    cursor:pointer;
}

.ptt.tx{
    background:
    radial-gradient(circle,
    #ff5252,#d50000 60%,#700000);

    box-shadow:
    0 0 30px red,
    inset 0 0 30px #ff8a80;
}

.ptt:disabled{
    opacity:.4;
}

.hint{
    margin-top:8px;
    color:#90a4ae;
    font-size:12px;
}

.panel{
    margin-top:14px;
    padding:12px;
    border-radius:12px;
    border:1px solid #263238;
    background:#0c1114;
}

.title{
    color:#00e5ff;
    font-size:12px;
    font-weight:bold;
    margin-bottom:9px;
}

button.normal{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#263238;
    color:white;
    font-weight:bold;
    margin-top:6px;
    cursor:pointer;
}

button.normal:active{
    background:#455a64;
}

button.micOn{
    background:#00c853;
    color:#001b09;
}

button.micOff{
    background:#263238;
    color:white;
}

.channelList{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
}

.channelBtn{
    padding:12px 5px;
    border:1px solid #37474f;
    border-radius:9px;
    background:#11181c;
    color:#90a4ae;
    font-weight:bold;
}

.channelBtn.active{
    background:#76ff03;
    color:#071008;
    border-color:#76ff03;
}

.count{
    min-height:18px;
    margin-top:6px;
    text-align:center;
    color:#ffb300;
    font-family:monospace;
    font-weight:bold;
}

.status{
    text-align:center;
    margin-top:12px;
    color:#90a4ae;
    font-size:12px;
}

.micStatus{
    text-align:center;
    margin-top:7px;
    font-size:12px;
    color:#90a4ae;
}

.connected{
    color:#00e676 !important;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">WANS HT</div>

    <div class="sub">
        REAL VOICE • FREQUENCY • PTT
    </div>
</div>


<!-- RADIO -->

<div class="screen">

    <div class="display">

        <div class="top">
            <span id="channel">CH-01</span>
            <span>FM</span>
        </div>

        <div class="freq" id="freq">
            433.500
        </div>

        <div class="rx" id="rx">
            STANDBY
        </div>

        <div class="signal" id="signal">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>

</div>


<!-- PTT -->

<div class="pttWrap">

    <button
        class="ptt"
        id="ptt"
        disabled>

        PTT

    </button>

    <div
        class="count"
        id="count">
    </div>

    <div class="hint">
        KLIK = ON/OFF • TAHAN LAMA = MAKS 5 DETIK
    </div>

</div>


<!-- MIC -->

<div class="panel">

    <div class="title">
        MICROPHONE
    </div>

    <button
        class="normal"
        id="micButton"
        onclick="toggleMic()">

        🎙️ IZINKAN MICROPHONE

    </button>

    <div
        class="micStatus"
        id="micStatus">

        MICROPHONE BELUM DIAKTIFKAN

    </div>

</div>


<!-- CHANNEL -->

<div class="panel">

    <div class="title">
        FREKUENSI / CHANNEL
    </div>

    <div
        class="channelList"
        id="channelList">
    </div>

</div>


<button
    class="normal"
    onclick="previousChannel()">

    ◀ CHANNEL -

</button>


<button
    class="normal"
    onclick="nextChannel()">

    CHANNEL + ▶

</button>


<div
    class="status"
    id="status">

    AKTIFKAN MICROPHONE

</div>


<audio
    id="remoteAudio"
    autoplay
    playsinline>
</audio>

</div>


<script>

/* =====================================================
   CHANNEL
===================================================== */

const frequencies = [
    "433.500",
    "433.525",
    "433.550",
    "433.575",
    "433.600",
    "433.625",
    "433.650",
    "433.675",
    "433.700",
    "433.725",
    "433.750",
    "433.775",
    "433.800",
    "433.825",
    "433.850",
    "433.875"
];

let channel = 1;


/* =====================================================
   PEER / AUDIO
===================================================== */

let peer = null;
let call = null;
let localStream = null;

let micAllowed = false;
let connected = false;


/* =====================================================
   PTT
===================================================== */

let transmitting = false;

let pointerDown = false;
let holdTimer = null;
let autoOffTimer = null;
let countdownTimer = null;

let holdMode = false;


/* =====================================================
   AUDIO EFFECT
===================================================== */

let audioCtx = null;
let master = null;


function initAudio(){

    if(audioCtx)
        return;

    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    master =
        audioCtx.createGain();

    master.gain.value = .25;

    master.connect(
        audioCtx.destination
    );

}


function beep(freq,duration){

    initAudio();

    if(
        audioCtx.state === "suspended"
    ){

        audioCtx.resume();

    }

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = "square";

    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
        0,
        audioCtx.currentTime
    );

    gain.gain.linearRampToValueAtTime(
        .20,
        audioCtx.currentTime+.005
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start();

    osc.stop(
        audioCtx.currentTime+
        duration+.02
    );

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text,
    color="#90a4ae"
){

    const el =
        document.getElementById("status");

    el.textContent = text;
    el.style.color = color;

}


/* =====================================================
   MICROPHONE
===================================================== */

async function enableMic(){

    try{

        if(localStream){

            micAllowed = true;

            return true;

        }


        localStream =
            await navigator.mediaDevices
            .getUserMedia({

                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                },

                video:false

            });


        /*
         * Mic langsung dalam kondisi OFF.
         * Baru ON ketika PTT aktif.
         */

        localStream
        .getAudioTracks()
        .forEach(
            track=>{
                track.enabled = false;
            }
        );


        micAllowed = true;


        document
        .getElementById("micButton")
        .textContent =
            "🎙️ MICROPHONE AKTIF";

        document
        .getElementById("micButton")
        .classList.add(
            "micOn"
        );

        document
        .getElementById("micStatus")
        .textContent =
            "MICROPHONE SIAP • PTT AKAN MENGIRIM SUARA";

        document
        .getElementById("micStatus")
        .style.color =
            "#00e676";


        document
        .getElementById("ptt")
        .disabled = false;


        setStatus(
            "MIC AKTIF • PILIH CHANNEL",
            "#00e676"
        );

        beep(1200,.08);

        return true;

    }catch(err){

        console.error(err);

        micAllowed = false;

        document
        .getElementById("micStatus")
        .textContent =
            "IZIN MICROPHONE DITOLAK / GAGAL";

        document
        .getElementById("micStatus")
        .style.color =
            "#ff5252";


        alert(
            "Microphone tidak bisa digunakan.\n\n"+
            "Pastikan izin microphone untuk browser sudah diizinkan."
        );

        return false;

    }

}


/* =====================================================
   TOGGLE MIC
===================================================== */

async function toggleMic(){

    if(!micAllowed){

        await enableMic();

        return;

    }


    /*
     * Tombol kedua kali:
     * matikan mic / izin sesi.
     */

    if(transmitting){

        stopPTT();

    }


    if(localStream){

        localStream
        .getAudioTracks()
        .forEach(
            track=>{
                track.enabled = false;
            }
        );

    }


    micAllowed = false;


    document
    .getElementById("ptt")
    .disabled = true;


    document
    .getElementById("micButton")
    .textContent =
        "🎙️ IZINKAN MICROPHONE";

    document
    .getElementById("micButton")
    .classList.remove(
        "micOn"
    );


    document
    .getElementById("micStatus")
    .textContent =
        "MICROPHONE DIMATIKAN";

    document
    .getElementById("micStatus")
    .style.color =
        "#90a4ae";


    setStatus(
        "MIC OFF",
        "#90a4ae"
    );

}


/* =====================================================
   PTT ON
===================================================== */

function startPTT(){

    if(!micAllowed)
        return;

    if(transmitting)
        return;


    transmitting = true;


    if(localStream){

        localStream
        .getAudioTracks()
        .forEach(
            track=>{
                track.enabled = true;
            }
        );

    }


    const ptt =
        document.getElementById("ptt");

    ptt.classList.add("tx");


    document
    .getElementById("rx")
    .textContent =
        "TX";


    document
    .getElementById("rx")
    .style.color =
        "#ff1744";


    setStatus(
        "🔴 TX • "+
        frequencies[channel-1]+
        " MHz",
        "#ff1744"
    );


    beep(750,.055);

    setTimeout(
        ()=>{
            beep(1250,.045);
        },
        65
    );

}


/* =====================================================
   PTT OFF
===================================================== */

function stopPTT(){

    if(!transmitting)
        return;


    transmitting = false;


    if(localStream){

        localStream
        .getAudioTracks()
        .forEach(
            track=>{
                track.enabled = false;
            }
        );

    }


    const ptt =
        document.getElementById("ptt");

    ptt.classList.remove("tx");


    document
    .getElementById("rx")
    .textContent =
        "STANDBY";


    document
    .getElementById("rx")
    .style.color =
        "#69f0ae";


    document
    .getElementById("count")
    .textContent =
        "";


    setStatus(
        "STANDBY • CH-"+
        String(channel).padStart(2,"0"),
        "#90a4ae"
    );


    beep(1100,.055);

    setTimeout(
        ()=>{
            beep(750,.08);
        },
        70
    );

}


/* =====================================================
   HOLD MODE
===================================================== */

function startHoldMode(){

    if(!micAllowed)
        return;


    holdMode = true;

    startPTT();


    let seconds = 5;


    document
    .getElementById("count")
    .textContent =
        "AUTO OFF " + seconds;


    countdownTimer =
        setInterval(
            ()=>{

                seconds--;


                if(seconds <= 0){

                    clearInterval(
                        countdownTimer
                    );

                    countdownTimer =
                        null;

                    holdMode = false;

                    document
                    .getElementById("count")
                    .textContent =
                        "";

                    stopPTT();

                    return;

                }


                document
                .getElementById("count")
                .textContent =
                    "AUTO OFF " +
                    seconds;

            },
            1000
        );


    autoOffTimer =
        setTimeout(
            ()=>{

                holdMode = false;

                document
                .getElementById("count")
                .textContent =
                    "";

                stopPTT();

            },
            5000
        );

}


/* =====================================================
   PTT DOWN
===================================================== */

function pttDown(e){

    e.preventDefault();


    if(!micAllowed)
        return;


    if(pointerDown)
        return;


    pointerDown = true;


    initAudio();


    if(
        audioCtx &&
        audioCtx.state === "suspended"
    ){

        audioCtx.resume();

    }


    /*
     * 400ms:
     * sebelum 400ms = klik biasa
     * setelah 400ms = tekan lama
     */

    holdTimer =
        setTimeout(
            ()=>{

                if(pointerDown){

                    startHoldMode();

                }

            },
            400
        );

}


/* =====================================================
   PTT UP
===================================================== */

function pttUp(e){

    e.preventDefault();


    if(!pointerDown)
        return;


    pointerDown = false;


    /*
     * KLIK BIASA
     */

    if(holdTimer){

        clearTimeout(
            holdTimer
        );

        holdTimer = null;


        if(!holdMode){

            /*
             * OFF -> ON
             * ON -> OFF
             */

            if(transmitting){

                stopPTT();

            }else{

                startPTT();

            }

        }

        return;

    }


    /*
     * MODE TEKAN LAMA
     */

    if(holdMode){

        holdMode = false;


        if(autoOffTimer){

            clearTimeout(
                autoOffTimer
            );

            autoOffTimer = null;

        }


        if(countdownTimer){

            clearInterval(
                countdownTimer
            );

            countdownTimer = null;

        }


        document
        .getElementById("count")
        .textContent =
            "";


        stopPTT();

    }

}


/* =====================================================
   PTT EVENT
===================================================== */

const ptt =
    document.getElementById("ptt");


ptt.addEventListener(
    "pointerdown",
    pttDown
);

ptt.addEventListener(
    "pointerup",
    pttUp
);

ptt.addEventListener(
    "pointercancel",
    pttUp
);

ptt.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);


/* =====================================================
   CHANNEL BUTTONS
===================================================== */

function createChannelButtons(){

    const box =
        document.getElementById(
            "channelList"
        );


    frequencies.forEach(
        (frequency,index)=>{

            const btn =
                document.createElement(
                    "button"
                );


            btn.className =
                "channelBtn";


            btn.innerHTML =
                "CH-"+
                String(index+1)
                .padStart(2,"0")+
                "<br>"+
                frequency+
                " MHz";


            btn.onclick =
                ()=>{

                    channel =
                        index+1;

                    updateChannel();

                };


            box.appendChild(btn);

        }
    );

}


/* =====================================================
   UPDATE CHANNEL
===================================================== */

function updateChannel(){

    document
    .getElementById("channel")
    .textContent =
        "CH-"+
        String(channel)
        .padStart(2,"0");


    document
    .getElementById("freq")
    .textContent =
        frequencies[channel-1];


    document
    .querySelectorAll(".channelBtn")
    .forEach(
        (btn,index)=>{

            btn.classList.toggle(
                "active",
                index === channel-1
            );

        }
    );


    signalRandom();


    setStatus(
        "CH-"+
        String(channel).padStart(2,"0")+
        " • "+
        frequencies[channel-1]+
        " MHz"
    );

}


/* =====================================================
   NEXT / PREVIOUS
===================================================== */

function nextChannel(){

    channel++;

    if(
        channel >
        frequencies.length
    ){

        channel = 1;

    }

    beep(900,.04);

    updateChannel();

}


function previousChannel(){

    channel--;

    if(channel < 1){

        channel =
            frequencies.length;

    }

    beep(650,.04);

    updateChannel();

}


/* =====================================================
   SIGNAL
===================================================== */

function signalRandom(){

    const bars =
        document
        .getElementById("signal")
        .children;


    const level =
        Math.floor(
            Math.random()*6
        )+2;


    for(
        let i=0;
        i<bars.length;
        i++
    ){

        bars[i]
        .classList
        .toggle(
            "on",
            i < level
        );

    }

}


/* =====================================================
   INIT
===================================================== */

createChannelButtons();

updateChannel();

setStatus(
    "AKTIFKAN MICROPHONE"
);

</script>

</body>
</html>
