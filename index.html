<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>WANS HT</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:#070909;
    color:white;
    font-family:Arial,sans-serif;
}

.app{
    width:min(430px,100%);
    min-height:100vh;
    margin:auto;
    padding:14px;
    background:
    radial-gradient(circle at top,#263238,#0a0d0f 55%);
}

.header{
    text-align:center;
    padding:13px;
    border:2px solid #37474f;
    border-radius:15px;
    background:#101518;
}

.logo{
    color:#00e5ff;
    font-size:25px;
    font-weight:bold;
    letter-spacing:4px;
}

.sub{
    margin-top:4px;
    font-size:11px;
    color:#90a4ae;
}

.screen{
    margin-top:14px;
    padding:14px;
    border:3px solid #263238;
    border-radius:15px;
    background:#030605;
    box-shadow:inset 0 0 25px #000;
}

.display{
    border:2px solid #37474f;
    border-radius:9px;
    padding:12px;
    background:#071008;
}

.top{
    display:flex;
    justify-content:space-between;
    color:#69f0ae;
    font-family:monospace;
    font-size:12px;
}

.freq{
    text-align:center;
    font-family:monospace;
    font-size:38px;
    font-weight:bold;
    color:#76ff03;
    margin:6px 0;
    text-shadow:0 0 8px #1b5e20;
}

.rx{
    text-align:center;
    color:#69f0ae;
    min-height:20px;
    font-family:monospace;
    font-weight:bold;
}

.signal{
    display:flex;
    gap:3px;
    height:8px;
    margin-top:8px;
}

.signal span{
    flex:1;
    background:#263238;
    border-radius:2px;
}

.signal span.on{
    background:#76ff03;
}

.pttWrap{
    text-align:center;
    margin-top:18px;
}

.ptt{
    width:215px;
    height:215px;
    border-radius:50%;
    border:10px solid #263238;

    background:
    radial-gradient(circle at 40% 30%,
    #ef5350,#c62828 55%,#700000);

    color:white;
    font-size:31px;
    font-weight:bold;

    box-shadow:
    0 12px 25px #000,
    inset 0 5px 12px #ff8a80;

    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.ptt.tx{
    background:
    radial-gradient(circle,
    #ff5252,#d50000 60%,#700000);

    box-shadow:
    0 0 30px red,
    inset 0 0 30px #ff8a80;
}

.ptt:disabled{
    opacity:.4;
}

.hint{
    margin-top:8px;
    color:#90a4ae;
    font-size:12px;
}

.panel{
    margin-top:14px;
    padding:12px;
    border-radius:12px;
    border:1px solid #263238;
    background:#0c1114;
}

.title{
    color:#00e5ff;
    font-size:12px;
    font-weight:bold;
    margin-bottom:9px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:8px;
    border-radius:9px;
    border:1px solid #455a64;
    background:#050707;
    color:white;
    font-size:16px;
}

button.normal{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#263238;
    color:white;
    font-weight:bold;
    margin-top:6px;
}

button.normal:active{
    background:#455a64;
}

button.normal.green{
    background:#00695c;
}

button.normal.red{
    background:#b71c1c;
}

.channelButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.chBtn{
    padding:12px 5px;
    border:1px solid #37474f;
    border-radius:8px;
    background:#11191d;
    color:#90a4ae;
    font-weight:bold;
}

.chBtn.active{
    background:#1b5e20;
    color:#76ff03;
    border-color:#76ff03;
}

.status{
    text-align:center;
    margin-top:12px;
    color:#90a4ae;
    font-size:12px;
}

.connected{
    color:#00e676 !important;
}

.txStatus{
    color:#ff5252 !important;
}

.peerList{
    margin-top:8px;
    font-family:monospace;
    font-size:11px;
    color:#69f0ae;
    text-align:center;
}

.remoteAudio{
    display:none;
}

.small{
    font-size:10px;
    color:#607d8b;
    text-align:center;
    margin-top:8px;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">WANS HT</div>
        <div class="sub">
            REAL VOICE • WEBRTC • CHANNEL
        </div>
    </div>

    <div class="screen">

        <div class="display">

            <div class="top">
                <span id="channel">CH-01</span>
                <span>FM</span>
            </div>

            <div class="freq" id="freq">
                433.500
            </div>

            <div class="rx" id="rx">
                STANDBY
            </div>

            <div class="signal" id="signal">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </div>

    <div class="pttWrap">

        <button
            class="ptt"
            id="ptt"
            disabled>
            PTT
        </button>

        <div class="hint">
            KLIK = ON/OFF • TAHAN = MAKS 5 DETIK
        </div>

    </div>

    <!-- MICROPHONE -->
    <div class="panel">

        <div class="title">
            MICROPHONE
        </div>

        <button
            class="normal"
            id="micButton">
            🎙️ IZINKAN MICROPHONE
        </button>

        <div class="small">
            Izinkan microphone terlebih dahulu sebelum PTT.
        </div>

    </div>

    <!-- NAMA -->
    <div class="panel">

        <div class="title">
            NAMA HT
        </div>

        <input
            id="name"
            value="WANS"
            placeholder="Nama HT">

    </div>

    <!-- CHANNEL -->
    <div class="panel">

        <div class="title">
            CHANNEL / FREKUENSI
        </div>

        <div
            class="channelButtons"
            id="channelButtons">
        </div>

        <button
            class="normal"
            onclick="previousChannel()">
            ◀ CHANNEL -
        </button>

        <button
            class="normal"
            onclick="nextChannel()">
            CHANNEL + ▶
        </button>

    </div>

    <div class="status" id="status">
        MEMUAT KONEKSI...
    </div>

    <div class="peerList" id="peerList">
        BELUM ADA HT LAIN
    </div>

    <div class="small">
        Channel yang sama = satu grup komunikasi.
    </div>

    <div id="audioContainer"></div>

</div>


<script type="module">

/* =========================================================
   TRYSTERO
   ========================================================= */

import {
    joinRoom
} from "https://esm.run/trystero";


/* =========================================================
   KONFIGURASI
   ========================================================= */

const APP_ID = "wans-ht-real-voice-v1";


const frequencies = [
    "433.500",
    "433.525",
    "433.550",
    "433.575",
    "433.600",
    "433.625",
    "433.650",
    "433.675",
    "433.700",
    "433.725",
    "433.750",
    "433.775",
    "433.800",
    "433.825",
    "433.850",
    "433.875"
];


/* =========================================================
   VARIABEL
   ========================================================= */

let currentChannel = 0;

let room = null;

let localStream = null;

let micEnabled = false;

let transmitting = false;

let holdMode = false;

let holdTimer = null;

let fiveSecondTimer = null;

let pressStarted = 0;

let pointerIsDown = false;

let remotePeers = new Map();


/* =========================================================
   ELEMENT
   ========================================================= */

const channelEl =
    document.getElementById("channel");

const freqEl =
    document.getElementById("freq");

const rxEl =
    document.getElementById("rx");

const statusEl =
    document.getElementById("status");

const peerListEl =
    document.getElementById("peerList");

const ptt =
    document.getElementById("ptt");

const micButton =
    document.getElementById("micButton");

const audioContainer =
    document.getElementById("audioContainer");

const signalBars =
    document.querySelectorAll("#signal span");

const channelButtons =
    document.getElementById("channelButtons");


/* =========================================================
   BUAT TOMBOL CHANNEL
   ========================================================= */

function createChannelButtons(){

    channelButtons.innerHTML = "";

    frequencies.forEach((freq,index)=>{

        const button =
            document.createElement("button");

        button.className = "chBtn";

        button.textContent =
            "CH-" +
            String(index + 1).padStart(2,"0");

        button.onclick = () => {

            if(index === currentChannel){
                return;
            }

            changeChannel(index);

        };

        channelButtons.appendChild(button);

    });

    updateChannelButtons();

}


/* =========================================================
   UPDATE DISPLAY
   ========================================================= */

function updateDisplay(){

    channelEl.textContent =
        "CH-" +
        String(currentChannel + 1).padStart(2,"0");

    freqEl.textContent =
        frequencies[currentChannel];

    updateChannelButtons();

}


/* =========================================================
   CHANNEL BUTTON ACTIVE
   ========================================================= */

function updateChannelButtons(){

    [...channelButtons.children]
        .forEach((button,index)=>{

            button.classList.toggle(
                "active",
                index === currentChannel
            );

        });

}


/* =========================================================
   ROOM ID
   ========================================================= */

function getRoomId(){

    /*
       Frekuensi dijadikan nama room.

       CH-01 = room 433.500
       CH-02 = room 433.525
       dst.
    */

    return "frequency-" +
           frequencies[currentChannel]
           .replace(".","-");

}


/* =========================================================
   MASUK CHANNEL
   ========================================================= */

async function joinCurrentChannel(){

    try{

        if(room){

            try{
                room.leave();
            }catch(e){}

            room = null;
        }


        remotePeers.clear();

        removeAllAudio();

        updatePeerList();


        const roomId =
            getRoomId();


        statusEl.textContent =
            "MENCARI HT DI " +
            frequencies[currentChannel] +
            "...";


        rxEl.textContent =
            "STANDBY";


        /*
          Room otomatis berdasarkan frekuensi.
          Tidak ada kode undangan.
        */

        room = joinRoom(
            {
                appId: APP_ID
            },
            roomId,
            {
                onJoinError(error){

                    console.error(error);

                    statusEl.textContent =
                        "KONEKSI ROOM GAGAL";

                }
            }
        );


        room.onPeerJoin =
            peerId => {

                console.log(
                    "HT MASUK:",
                    peerId
                );

                statusEl.textContent =
                    "HT LAIN TERDETEKSI";

                rxEl.textContent =
                    "STANDBY";

                updateSignal(
                    true
                );

                updatePeerList();

            };


        room.onPeerLeave =
            peerId => {

                console.log(
                    "HT KELUAR:",
                    peerId
                );

                removeAudio(
                    peerId
                );

                remotePeers.delete(
                    peerId
                );

                updatePeerList();

                if(remotePeers.size === 0){

                    rxEl.textContent =
                        "STANDBY";

                    statusEl.textContent =
                        "MENUNGGU HT LAIN";

                    updateSignal(false);

                }

            };


        room.onPeerStream =
            (stream,peerId) => {

                console.log(
                    "AUDIO DITERIMA:",
                    peerId
                );

                addRemoteAudio(
                    stream,
                    peerId
                );

            };


        statusEl.textContent =
            "CHANNEL AKTIF • " +
            frequencies[currentChannel];

        updateSignal(false);

    }catch(error){

        console.error(error);

        statusEl.textContent =
            "GAGAL TERHUBUNG";

    }

}


/* =========================================================
   MICROPHONE
   ========================================================= */

async function enableMicrophone(){

    if(micEnabled){

        disableMicrophone();

        return;

    }


    try{

        statusEl.textContent =
            "MEMINTA IZIN MICROPHONE...";


        localStream =
            await navigator.mediaDevices.getUserMedia({

                audio:{
                    echoCancellation:true,
                    noiseSuppression:true,
                    autoGainControl:true
                },

                video:false

            });


        /*
           Awalnya microphone OFF.
           PTT yang akan mengaktifkannya.
        */

        localStream
            .getAudioTracks()
            .forEach(track=>{
                track.enabled = false;
            });


        micEnabled = true;


        ptt.disabled = false;


        micButton.textContent =
            "🔴 MATIKAN MICROPHONE";

        micButton.classList.add(
            "red"
        );


        statusEl.textContent =
            "MICROPHONE SIAP";


        /*
          Kirim stream audio ke room.
        */

        if(room){

            room.addStream(
                localStream
            );

        }

    }catch(error){

        console.error(error);

        statusEl.textContent =
            "IZIN MICROPHONE DITOLAK";

        alert(
            "Microphone tidak diizinkan.\n\n" +
            "Tekan tombol IZINKAN MICROPHONE " +
            "lalu izinkan microphone pada browser."
        );

    }

}


/* =========================================================
   MATIKAN MICROPHONE
   ========================================================= */

function disableMicrophone(){

    stopTransmit();


    if(localStream){

        localStream
            .getTracks()
            .forEach(track=>{
                track.stop();
            });

    }


    localStream = null;

    micEnabled = false;

    ptt.disabled = true;

    micButton.textContent =
        "🎙️ IZINKAN MICROPHONE";

    micButton.classList.remove(
        "red"
    );


    rxEl.textContent =
        "STANDBY";


    statusEl.textContent =
        "MICROPHONE OFF";

}


/* =========================================================
   MULAI TRANSMIT
   ========================================================= */

function startTransmit(){

    if(!micEnabled || !localStream){

        return;

    }


    if(transmitting){

        return;

    }


    transmitting = true;


    localStream
        .getAudioTracks()
        .forEach(track=>{
            track.enabled = true;
        });


    ptt.classList.add(
        "tx"
    );


    rxEl.textContent =
        "TX • BERBICARA";

    rxEl.classList.add(
        "txStatus"
    );


    statusEl.textContent =
        "TRANSMIT";


    updateSignal(true);

}


/* =========================================================
   STOP TRANSMIT
   ========================================================= */

function stopTransmit(){

    transmitting = false;


    if(localStream){

        localStream
            .getAudioTracks()
            .forEach(track=>{
                track.enabled = false;
            });

    }


    ptt.classList.remove(
        "tx"
    );


    rxEl.classList.remove(
        "txStatus"
    );


    rxEl.textContent =
        "STANDBY";


    if(micEnabled){

        statusEl.textContent =
            remotePeers.size
            ? "CHANNEL AKTIF"
            : "MENUNGGU HT LAIN";

    }


    updateSignal(
        remotePeers.size > 0
    );

}


/* =========================================================
   QUICK CLICK
   ========================================================= */

function quickClick(){

    if(!micEnabled){

        return;

    }


    /*
       Klik biasa = toggle.
    */

    if(transmitting){

        stopTransmit();

    }else{

        startTransmit();

    }

}


/* =========================================================
   LONG PRESS
   ========================================================= */

function startHoldMode(){

    if(!micEnabled){

        return;

    }


    holdMode = true;

    startTransmit();


    let remaining = 5;


    rxEl.textContent =
        "TX • " +
        remaining +
        " DETIK";


    fiveSecondTimer =
        setInterval(()=>{

            remaining--;


            if(remaining > 0){

                rxEl.textContent =
                    "TX • " +
                    remaining +
                    " DETIK";

            }

        },1000);


    holdTimer =
        setTimeout(()=>{

            stopHoldMode();

        },5000);

}


/* =========================================================
   STOP LONG PRESS
   ========================================================= */

function stopHoldMode(){

    if(holdTimer){

        clearTimeout(
            holdTimer
        );

        holdTimer = null;

    }


    if(fiveSecondTimer){

        clearInterval(
            fiveSecondTimer
        );

        fiveSecondTimer = null;

    }


    holdMode = false;


    stopTransmit();

}


/* =========================================================
   PTT POINTER DOWN
   ========================================================= */

ptt.addEventListener(
    "pointerdown",
    event => {

        if(ptt.disabled){

            return;

        }


        event.preventDefault();


        pointerIsDown = true;

        pressStarted =
            Date.now();


        /*
          Tunggu 400ms.
          Kalau masih ditekan = LONG PRESS.
        */

        holdTimer =
            setTimeout(()=>{

                if(pointerIsDown){

                    if(holdTimer){

                        clearTimeout(
                            holdTimer
                        );

                        holdTimer = null;

                    }

                    startHoldMode();

                }

            },400);

    }
);


/* =========================================================
   PTT POINTER UP
   ========================================================= */

function handlePointerUp(event){

    if(!pointerIsDown){

        return;

    }


    event.preventDefault();


    pointerIsDown = false;


    const duration =
        Date.now() - pressStarted;


    /*
      Kalau sudah masuk long press:
      release = OFF.
    */

    if(holdMode){

        stopHoldMode();

        return;

    }


    /*
      Batalkan timer long press.
    */

    if(holdTimer){

        clearTimeout(
            holdTimer
        );

        holdTimer = null;

    }


    /*
      Kurang dari 400ms = quick click.
    */

    if(duration < 400){

        quickClick();

    }

}


ptt.addEventListener(
    "pointerup",
    handlePointerUp
);

ptt.addEventListener(
    "pointercancel",
    handlePointerUp
);

ptt.addEventListener(
    "pointerleave",
    event => {

        /*
          Jangan langsung mematikan
          mode toggle hanya karena jari
          keluar sedikit dari tombol.

          Tetapi long press akan OFF
          jika pointer dilepas/cancel.
        */

        if(
            pointerIsDown &&
            holdMode
        ){

            handlePointerUp(event);

        }

    }
);


/* =========================================================
   REMOTE AUDIO
   ========================================================= */

function addRemoteAudio(
    stream,
    peerId
){

    removeAudio(
        peerId
    );


    const audio =
        document.createElement("audio");


    audio.className =
        "remoteAudio";

    audio.id =
        "audio-" + peerId;

    audio.autoplay = true;

    audio.playsInline = true;

    audio.srcObject =
        stream;


    audioContainer.appendChild(
        audio
    );


    remotePeers.set(
        peerId,
        audio
    );


    audio.play()
        .catch(error=>{
            console.log(
                "Autoplay menunggu interaksi:",
                error
            );
        });


    rxEl.textContent =
        "RX • HT TERHUBUNG";


    rxEl.classList.remove(
        "txStatus"
    );


    statusEl.textContent =
        "TERHUBUNG • " +
        remotePeers.size +
        " HT";


    updateSignal(true);

    updatePeerList();

}


/* =========================================================
   HAPUS AUDIO
   ========================================================= */

function removeAudio(
    peerId
){

    const audio =
        remotePeers.get(
            peerId
        );


    if(audio){

        audio.srcObject = null;

        audio.remove();

    }


    remotePeers.delete(
        peerId
    );

}


/* =========================================================
   HAPUS SEMUA AUDIO
   ========================================================= */

function removeAllAudio(){

    remotePeers.forEach(
        audio=>{

            audio.srcObject = null;

            audio.remove();

        }
    );


    remotePeers.clear();

}


/* =========================================================
   PEER LIST
   ========================================================= */

function updatePeerList(){

    const count =
        remotePeers.size;


    if(count === 0){

        peerListEl.textContent =
            "BELUM ADA HT LAIN";

        return;

    }


    peerListEl.textContent =
        count +
        " HT TERHUBUNG DI CHANNEL INI";

}


/* =========================================================
   SIGNAL
   ========================================================= */

function updateSignal(active){

    signalBars.forEach(
        (bar,index)=>{

            if(active){

                bar.classList.add(
                    "on"
                );

            }else{

                bar.classList.remove(
                    "on"
                );

            }

        }
    );

}


/* =========================================================
   GANTI CHANNEL
   ========================================================= */

async function changeChannel(
    index
){

    if(index < 0){

        index =
            frequencies.length - 1;

    }


    if(
        index >= frequencies.length
    ){

        index = 0;

    }


    /*
      Matikan TX sebelum pindah.
    */

    stopTransmit();


    currentChannel =
        index;


    updateDisplay();


    await joinCurrentChannel();

}


/* =========================================================
   CHANNEL -
   ========================================================= */

window.previousChannel =
    function(){

        changeChannel(
            currentChannel - 1
        );

    };


/* =========================================================
   CHANNEL +
   ========================================================= */

window.nextChannel =
    function(){

        changeChannel(
            currentChannel + 1
        );

    };


/* =========================================================
   MICROPHONE BUTTON
   ========================================================= */

micButton.addEventListener(
    "click",
    enableMicrophone
);


/* =========================================================
   START
   ========================================================= */

createChannelButtons();

updateDisplay();

joinCurrentChannel();


/* =========================================================
   PAGE CLOSE
   ========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        try{

            if(room){

                room.leave();

            }

        }catch(e){}

        if(localStream){

            localStream
                .getTracks()
                .forEach(track=>{
                    track.stop();
                });

        }

    }
);

</script>

</body>
</html>
